# Lower latency for audio interfaces from pro-audio vendors.
#
# Rules see node properties. ALSA nodes carry their card's api.alsa.card.*,
# alsa.* and device.bus; device.product.name and device.vendor.* stay on the
# device. A USB card's long name starts with its maker, as in "Focusrite
# Scarlett 2i2 USB at usb-...". Any FireWire sound card counts: the bus
# carries little else.

monitor.alsa.rules = [
    {
        matches = [
            {
                api.alsa.card.longname = "~^(RME|MOTU|Focusrite|PreSonus|Universal Audio|SSL|Solid State Logic|Allen ?(&|and)? ?Heath|TASCAM|Native Instruments|Apogee)[ -]"
            }
            {
                device.bus = "firewire"
            }
        ]
        actions = {
            update-props = {
                # Caps graph cycles at 512 frames while the interface plays or
                # records, desktop sound included: twice the cycles of the
                # 1024-frame default.
                node.latency = "512/48000"
                # PipeWire's default, which 61-biglinux-alsa-headroom.conf,
                # sorted before this file, raises to 1024 on every USB, PCI,
                # platform and ACP card.
                api.alsa.headroom = 0
            }
        }
    }
]
