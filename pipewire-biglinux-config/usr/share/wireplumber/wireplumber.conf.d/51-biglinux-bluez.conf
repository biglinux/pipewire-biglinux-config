# Bluetooth audio settings for BigLinux.

wireplumber.settings = {
    # A2DP stays on when a program opens a microphone. It has no headset mic,
    # so calls need a manual profile switch, or
    # `wpctl settings --save bluetooth.autoswitch-to-headset-profile true`.
    bluetooth.autoswitch-to-headset-profile = false
}

monitor.bluez.rules = [
    {
        matches = [
            {
                device.name = "~bluez_card.*"
            }
        ]
        actions = {
            update-props = {
                # A headset (hfp_hf, a2dp_sink) or phone (hfp_ag, a2dp_source)
                # that reconnects with only some of its profiles gets the rest
                # connected too.
                bluez5.auto-connect = [ hfp_hf a2dp_sink hfp_ag a2dp_source ]
                # Constant bitrate in place of PipeWire's VBR default, on
                # headsets that advertise VBR: only at a constant bitrate does
                # the encoder lower the bitrate when the link weakens.
                bluez5.a2dp.aac.bitratemode = 0
            }
        }
    }
]
