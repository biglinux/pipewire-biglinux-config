# Make a newly connected output the default sink; the script has the rules.
#
# A virtual component wants the script instead of requiring it, so a script
# that fails to load costs only this feature, logged as a notice, instead of
# taking WirePlumber and every sound down with it.

wireplumber.profiles = {
  main = {
    biglinux.switch-on-connect = required
  }
}

wireplumber.components = [
  {
    name = biglinux/switch-on-connect.lua, type = script/lua
    provides = hooks.biglinux.switch-on-connect
  }
  {
    type = virtual, provides = biglinux.switch-on-connect
    wants = [ hooks.biglinux.switch-on-connect ]
  }
]
